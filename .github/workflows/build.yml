name: Build & Release DeckRomM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release on GitHub'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage (Steam Deck / SteamOS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package Linux AppImage
        run: npm run dist:appimage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeckRomM-Linux-SteamOS
          path: release/*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-release
          find release-artifacts/ -type f -name "*.AppImage" -exec cp {} dist-release/ \;
          PRIMARY=$(ls -t dist-release/*.AppImage 2>/dev/null | head -n1 || true)
          if [ -n "$PRIMARY" ] && [ "$PRIMARY" != "dist-release/DeckRomM.AppImage" ]; then
            cp "$PRIMARY" dist-release/DeckRomM.AppImage
          fi
          ls -la dist-release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'DeckRomM Latest (SteamOS)' }}
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

